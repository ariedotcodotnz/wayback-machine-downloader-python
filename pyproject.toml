[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayback-downloader"
version = "0.1.0"
description = "Object-oriented Python downloader for Internet Archive Wayback Machine snapshots."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenAI Codex" },
]
dependencies = []

[project.scripts]
wayback-machine-downloader = "wayback_downloader.cli:main"

[tool.setuptools]
packages = ["wayback_downloader"]
